[project]
name = "logpacker"
version = "0.1.0"
description = "Turn a Qlik Replicate task log into a sanitized, AI-ready prompt package."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "mcp>=2",
]

[project.scripts]
logpacker = "logpacker.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["logpacker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
