<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LogPacker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23009845'/%3E%3Cpath d='M9 12l7-4 7 4v8l-7 4-7-4z' fill='none' stroke='white' stroke-width='2.2' stroke-linejoin='round'/%3E%3Cpath d='M9 12l7 4 7-4M16 16v8' fill='none' stroke='white' stroke-width='2.2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/reports.css">
  <script>
    try { const t = localStorage.getItem("lp-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Qlik LogPacker home">
      <img src="logos/logo-qlik_d49uek.svg" alt="Qlik" class="brand-qlik brand-qlik-light" height="24" />
      <img src="logos/qlik-wordmark-dark.svg" alt="Qlik" class="brand-qlik brand-qlik-dark" height="24" />
      <span class="brand-sep" aria-hidden="true"></span>
      <span class="brand-product">LogPacker</span>
    </a>
    <nav class="stepper" id="stepper" aria-label="Progress"></nav>
    <div class="topbar-actions">
      <a class="icon-btn" href="#/mcp" aria-label="MCP settings" title="MCP — AI assistant integration">
        <img src="logos/mcp-icon.svg" alt="" width="18" height="18" aria-hidden="true" style="display:block">
      </a>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>
  <main id="app" class="container" tabindex="-1"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
